[package]
name = "boj-discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
base64 = "0.22"
ring = "0.17"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2"
dotenvy = "0.15"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "model", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
